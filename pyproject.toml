[project]
name = "tabfm-workbench"
version = "0.1.0"
description = "Local-first research workbench for Google Research TabFM"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "altair>=5.5,<7",
  "httpx>=0.28.1,<0.29",
  "openpyxl>=3.1.5,<4",
  "pandas>=2.3.1,<3",
  "pyarrow>=20,<21",
  "pydantic-settings>=2.10.1,<3",
  "reportlab>=4.4,<5",
  "scikit-learn>=1.7,<2",
  "streamlit>=1.47,<2",
  "vl-convert-python>=1.8,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
integrations = [
  "huggingface-hub>=0.34,<1",
  "kaggle>=1.7.4,<2",
  "mcp>=1.12,<2",
]
cu130 = [
  "torch==2.12.1",
  "tabfm @ https://github.com/google-research/tabfm/archive/cb6ba46b7ebc9a6581a81827e14e9c246202afb9.zip",
]
cpu = [
  "torch==2.12.1",
  "tabfm @ https://github.com/google-research/tabfm/archive/cb6ba46b7ebc9a6581a81827e14e9c246202afb9.zip",
]
slides = [
  "python-pptx>=1.0.2,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pandas-stubs>=2.3,<3",
  "pypdf>=5.8,<6",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.uv]
conflicts = [[{ extra = "cu130" }, { extra = "cpu" }]]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cpu", extra = "cpu" },
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src.tabfm_workbench"]

[[tool.mypy.overrides]]
module = ["kaggle.*", "sklearn.*", "tabfm", "torch"]
ignore_missing_imports = true
